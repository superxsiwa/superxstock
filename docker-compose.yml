version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: superx_timescaledb
    environment:
      POSTGRES_USER: superx
      POSTGRES_PASSWORD: superxpassword
      POSTGRES_DB: superxstock
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: superx_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8888:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://superx:superxpassword@timescaledb:5432/superxstock}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATA_PROVIDER: ${DATA_PROVIDER:-YAHOO}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a value with at least 32 characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ALPHA_VANTAGE_SYMBOL_SUFFIX: ${ALPHA_VANTAGE_SYMBOL_SUFFIX:-.BKK}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://superx:superxpassword@timescaledb:5432/superxstock}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATA_PROVIDER: ${DATA_PROVIDER:-YAHOO}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a value with at least 32 characters}
      CELERY_TIMEZONE: Asia/Bangkok
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ALPHA_VANTAGE_SYMBOL_SUFFIX: ${ALPHA_VANTAGE_SYMBOL_SUFFIX:-.BKK}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://superx:superxpassword@timescaledb:5432/superxstock}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATA_PROVIDER: ${DATA_PROVIDER:-YAHOO}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a value with at least 32 characters}
      CELERY_TIMEZONE: Asia/Bangkok
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescaledb_data:
